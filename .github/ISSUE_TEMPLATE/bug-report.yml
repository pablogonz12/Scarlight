name: Bug report
description: Something crashes, hangs, renders wrong or logs an error.
title: "bug: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Text and logs only — never attach game files, game content screenshots or hashes of game
        data ([docs/asset-policy.md](https://github.com/pablogonz12/Scarlight/blob/main/docs/asset-policy.md)).
        A run that works is worth reporting too: use the **Test report** form for that.
  - type: input
    id: commit
    attributes:
      label: ScarLight commit
      description: Output of `git rev-parse --short HEAD`.
      placeholder: fcb278b
    validations:
      required: true
  - type: input
    id: gpu
    attributes:
      label: GPU
      placeholder: RX 9070 XT / RX 6800 / Arc A770
    validations:
      required: true
  - type: dropdown
    id: driver
    attributes:
      label: Vulkan driver
      options:
        - RADV (AMD)
        - ANV (Intel)
        - NVK (NVIDIA)
        - other (say which below)
    validations:
      required: true
  - type: input
    id: mesa
    attributes:
      label: Mesa version (paste driverName, driverVersion and apiVersion)
      description: The device section of `vulkaninfo --summary`, plus where Mesa came from — distribution package, mesa-git, or a local build. driverVersion identifies the driver release; apiVersion alone does not.
      placeholder: driverName radv, driverVersion 26.3.1, apiVersion 1.4.363, distribution package
    validations:
      required: true
  - type: input
    id: kernel
    attributes:
      label: Kernel version
      description: Output of `uname -r`.
      placeholder: 7.3.6-1-cachyos-eevdf
    validations:
      required: true
  - type: input
    id: distro
    attributes:
      label: Distribution and session
      placeholder: CachyOS (Arch family), Wayland
    validations:
      required: true
  - type: input
    id: proton
    attributes:
      label: Proton or Wine build
      description: Which build, and whether you call its `wine` binary directly.
      placeholder: GE-Proton11-14, called through files/bin/wine
    validations:
      required: true
  - type: input
    id: vkd3d
    attributes:
      label: vkd3d-proton version
      description: Stock release, the DLLs GE-Proton ships, or master; and how it is selected.
      placeholder: vkd3d-proton master, d3d12.dll next to victory.exe
    validations:
      required: true
  - type: dropdown
    id: progress
    attributes:
      label: How far did it get
      options:
        - No boot (nothing on screen)
        - Menus
        - Loading
        - World
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Command line, environment variables (`VKD3D_CONFIG`, `WINEDLLOVERRIDES`, `VICTORY_*`), config changes, what you did in the title.
      placeholder: |
        1. Build with cargo xwin build --release -p victory
        2. Run with WINEDLLOVERRIDES="d3d12,d3d12core,dxgi=n,b" VICTORY_NO_WATCHDOG=1
        3. Enter the world
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual result
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log excerpt
      description: |
        The last ~50 lines around the failure with `VICTORY_LOG=info`, from the console or
        `crashes.log`. Trim anything that is game content.
      render: shell
    validations:
      required: true
  - type: checkboxes
    id: policy
    attributes:
      label: Asset policy
      options:
        - label: This report contains no game files, no screenshots of game content and no hashes of game data.
          required: true
