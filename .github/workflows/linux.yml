name: Linux

# The claim this repository makes is that it is built on Linux, for Linux, so
# the exe the quick start produces has to come out of a Linux runner too. The
# build target stays Windows (the title runs under Wine): cargo-xwin supplies
# Microsoft's CRT and headers, llvm links it, and the result is the same exe as
# the README's `cargo xwin build`. No title data is involved: this is our own
# build, uploaded as a workflow artifact.
#
# The windows-latest `check` job in ci.yml stays as it is: it lints and tests on
# the target OS. This workflow proves the Linux side of the same story.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      # The version, target and components pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - name: Cross-build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang lld llvm
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-xwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-xwin
      # Microsoft's CRT and Windows headers, about 100 MB. Unchanged unless the
      # toolchain pin moves.
      - name: Cache cargo-xwin's CRT and headers
        uses: actions/cache@v6
        with:
          path: ~/.cache/cargo-xwin
          key: cargo-xwin-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}
      - name: Build the Windows exe on Linux
        run: cargo xwin build --release -p victory --features diagnostics --target x86_64-pc-windows-msvc --locked
      # The launcher and the tooling are shell we ship; lint them where they run.
      - name: Shellcheck the shell under tools/
        run: |
          mapfile -t scripts < <(git ls-files 'tools/*.sh' 'tools/**/*.sh' 'tools/scarlight-launcher/scarlight' 'tools/steam-compat/scarlight')
          printf 'shellcheck %s\n' "${scripts[*]}"
          shellcheck --version | head -2
          shellcheck -x -S warning "${scripts[@]}"
      - uses: actions/upload-artifact@v7
        with:
          name: victory-windows-x86_64
          path: target/x86_64-pc-windows-msvc/release/victory.exe
          if-no-files-found: error
          retention-days: 14
